<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar Dashboard — Lokalin</title>
  <meta name="description" content="Dashboard minuman real-time untuk bar." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ── Header ── -->
<div class="bar-header">
  <div class="left">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-icon">🍹</span>
    <div>
      <div class="page-title">Bar Dashboard</div>
      <div class="ws-label">Real-time orders</div>
    </div>
  </div>
  <div class="bar-header-right">
    <div class="order-counter"><span id="active-count">0</span> aktif</div>
    <div class="ws-status">
      <div class="ws-dot" id="ws-dot"></div>
      <span class="ws-label" id="ws-label">Menghubungkan…</span>
    </div>
  </div>
</div>
<div class="dashboard-summary">
  <div class="summary-card">
    <div class="summary-label">Pesanan Aktif</div>
    <div class="summary-value" id="active-count-summary">0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Menunggu</div>
    <div class="summary-value" id="count-pending-summary">0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Diproses</div>
    <div class="summary-value" id="count-progress-summary">0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Siap</div>
    <div class="summary-value" id="count-ready-summary">0</div>
  </div>
</div>

<!-- ── Kanban Board ── -->
<div class="kanban">
  <!-- Pending -->
  <div class="kanban-col" id="col-pending">
    <div class="col-header">
      <span>🕐</span>
      <h3 class="status-label status-pending">Pending</h3>
      <span class="col-count" id="count-pending">0</span>
    </div>
    <div class="col-cards" id="cards-pending"></div>
  </div>

  <!-- In Progress -->
  <div class="kanban-col" id="col-progress">
    <div class="col-header">
      <span>⚡</span>
      <h3 class="status-label status-progress">Diproses</h3>
      <span class="col-count" id="count-progress">0</span>
    </div>
    <div class="col-cards" id="cards-progress"></div>
  </div>

  <!-- Ready -->
  <div class="kanban-col" id="col-ready">
    <div class="col-header">
      <span>✅</span>
      <h3 class="status-label status-ready">Siap</h3>
      <span class="col-count" id="count-ready">0</span>
    </div>
    <div class="col-cards" id="cards-ready"></div>
  </div>
</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar-nav">
  <div class="sidebar-header">
    <div class="restaurant-name">🍽️ Lokalin</div>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <a href="/order?table=5" class="sidebar-link">📱 Pesan (Customer)</a>
  <a href="/bar" class="sidebar-link">🍹 Bar Dashboard</a>
  <a href="/cashier" class="sidebar-link">🧾 Kasir</a>
  <a href="/admin" class="sidebar-link">⚙️ Admin Menu</a>
</div>

<script src="/bar.js"></script>
</body>
</html>
