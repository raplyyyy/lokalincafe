<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Stock Management — Lokalin</title>
  <meta name="description" content="Daily stock management." />
  <link rel="stylesheet" href="/style.css?v=13" />
  <script src="/pin.js"></script>
  <style>
    /* ── Stock Table (Desktop) ── */
    .stock-table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-x: auto;
      margin-bottom: 24px;
    }
    .stock-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      text-align: left;
    }
    .stock-table th {
      padding: 10px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-strong);
      font-weight: 700;
      letter-spacing: 0.05em;
      background: var(--bg-card);
      white-space: nowrap;
    }
    .stock-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .stock-table tr:last-child td { border-bottom: none; }
    .stock-table input[type=number] {
      width: 56px; padding: 6px 8px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-family: inherit; font-size: 0.9rem; text-align: center;
      transition: var(--transition);
    }
    .stock-table input[type=number]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .stock-table input::-webkit-outer-spin-button,
    .stock-table input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .stock-table input[type=number] { -moz-appearance: textfield; }

    /* ── Stock Cards (Mobile) ── */
    .stock-cards { display: none; margin-bottom: 24px; }
    .stock-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .stock-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stock-card-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      flex: 1;
    }
    .stock-card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .stock-card-field label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }
    .stock-card-field input[type=number] {
      width: 100%; padding: 8px 6px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-family: inherit; font-size: 1rem; font-weight: 700;
      text-align: center; transition: var(--transition);
    }
    .stock-card-field input[type=number]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .stock-card-field input::-webkit-outer-spin-button,
    .stock-card-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .stock-card-field input[type=number] { -moz-appearance: textfield; }

    /* ── Badges ── */
    .stock-akhir-badge {
      display: inline-block; padding: 4px 12px;
      border-radius: var(--radius-md); font-weight: 800; font-size: 1rem;
      min-width: 48px; text-align: center;
    }
    .stock-normal  { background: rgba(49,151,149,.2); color: #3ed598; border: 1px solid rgba(49,151,149,.4); }
    .stock-warning { background: rgba(245,158,11,.2); color: #fbd38d; border: 1px solid rgba(245,158,11,.4); }
    .stock-danger  { background: rgba(229,62,62,.2);  color: #fc8181; border: 1px solid rgba(229,62,62,.4); }

    /* ── Alert Banner ── */
    .alert-banner {
      background: rgba(229,62,62,.15); border: 1px solid rgba(229,62,62,.4);
      color: #fc8181; padding: 12px 16px; border-radius: var(--radius-md);
      margin-bottom: 16px; font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }

    /* ── Delete Btn ── */
    .icon-btn-del {
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      color: var(--text-muted); width: 32px; height: 32px;
      border-radius: var(--radius-md); cursor: pointer; transition: var(--transition);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .icon-btn-del:hover { background: rgba(229,62,62,.2); color: #fc8181; border-color: rgba(229,62,62,.4); }

    /* ── Action Buttons (Mobile-friendly grid) ── */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .action-grid .btn { justify-content: center; font-size: 0.82rem; padding: 10px 8px; }
    .action-grid .btn-primary { grid-column: 1 / -1; }

    /* ── Compact Add Form (Mobile) ── */
    .add-form-compact {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      margin-bottom: 20px;
    }
    .add-form-compact h3 { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
    .add-form-compact .form-inline {
      display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
    }
    .add-form-compact .form-inline input {
      flex: 1; min-width: 120px; padding: 10px 12px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-family: inherit; font-size: 0.9rem;
    }
    .add-form-compact .form-inline input:focus {
      outline: none; border-color: var(--accent);
    }
    .add-form-compact .inp-initial {
      width: 72px !important; min-width: 72px !important; flex: none !important;
      text-align: center;
    }

    /* ── History ── */
    .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; }
    .history-date { font-weight: 700; font-size: 1.1rem; color: var(--accent); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid var(--border-strong); text-align: left; }
    .history-table th { color: var(--text-muted); }

    /* ── Responsive switch ── */
    @media (max-width: 640px) {
      .stock-table-container { display: none; }
      .stock-cards { display: block; }
      .action-grid .btn-primary { font-size: 0.88rem; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="admin-header">
  <div class="admin-header-left">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-icon">📦</span>
    <div class="page-title">Daily Stock Management</div>
  </div>
</div>

<div class="admin-body">

  <div class="tabs-wrapper" style="margin-bottom: 24px; max-width: none; padding: 0;">
    <div class="tab-nav" style="margin: 0; display: inline-flex;">
      <button class="tab-btn active" onclick="switchStockTab('kitchen')">🍳 Kitchen</button>
      <button class="tab-btn" onclick="switchStockTab('bar')">🍹 Bar</button>
    </div>
  </div>

  <!-- Action Buttons: 2-column grid on mobile -->
  <div class="action-grid">
    <button id="closeDayBtn" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Close Day
    </button>
    <button id="saveDraftBtn" class="btn btn-ghost" style="border-color:var(--accent);color:var(--accent);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button id="refreshDataBtn" class="btn btn-ghost" onclick="refreshStockData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
    <button id="viewHistoryBtn" class="btn btn-ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      History
    </button>
    <button onclick="openExportModal()" class="btn" style="background:#1d6f42;color:#fff;border:none;grid-column:1/-1;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export Excel
    </button>
  </div>
  <!-- Compact Add Form -->
  <div class="add-form-compact">
    <h3 id="add-title">+ Add Menu to Stock</h3>
    <div class="form-inline">
      <input type="text" id="inp-name" placeholder="Menu name (e.g., Fried Rice)" />
      <input type="number" id="inp-initial" placeholder="0" min="0" value="0" class="inp-initial" />
      <button class="btn btn-primary" onclick="addStockItem()" style="white-space:nowrap;">+ Add</button>
    </div>
  </div>

  <div id="alertContainer"></div>

  <!-- Stock Table (Desktop) -->
  <div class="stock-table-container">
    <table class="stock-table">
      <thead>
        <tr>
          <th>Menu Name</th>
          <th>Initial</th>
          <th>IN</th>
          <th>OUT</th>
          <th>Spoil</th>
          <th style="text-align:center;">Final</th>
          <th style="text-align:center;">Action</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>

  <!-- Stock Cards (Mobile) -->
  <div class="stock-cards" id="stockCards"></div>


<!-- History Modal -->
<div id="historyModal" class="modal-overlay">
  <div class="checkout-panel" style="max-height: 85vh; overflow-y: auto; text-align: left; max-width: 900px; opacity: 1 !important; transform: none !important;">
    <div class="checkout-header">
      <h2 class="checkout-title">🗓️ Daily Recap History</h2>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-ghost" onclick="clearHistory()" style="padding: 6px 12px; color: #fc8181; border-color: rgba(229,62,62,0.3); font-size: 0.8rem;">🗑️ Clear</button>
        <button class="modal-close" onclick="closeHistoryModal()">✕</button>
      </div>
    </div>
    <div id="historyContainer" style="margin-top: 16px;">
      <!-- Dates and tables injected here -->
    </div>
  </div>
</div>

<!-- Export Modal -->
<div id="exportModal" class="modal-overlay">
  <div class="checkout-panel" style="text-align: left; opacity: 1 !important; transform: none !important;">
    <div class="checkout-header">
      <h2 class="checkout-title">📊 Export Data to Excel</h2>
      <button class="modal-close" onclick="closeExportModal()">✕</button>
    </div>
    
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label>Report Format</label>
        <select id="export-type" class="modal-textarea" style="height: 48px; padding: 12px; font-weight: 600;" onchange="toggleExportInputs()">
          <option value="hari_ini">Today's Recap (Not Closed)</option>
          <option value="harian">Daily Report (Select Date)</option>
          <option value="bulanan">Monthly Report (Select Month)</option>
          <option value="semua">All Saved History</option>
        </select>
      </div>
      
      <div class="form-group" id="export-date-group" style="display: none;">
        <label>Select Date</label>
        <input type="date" id="export-date" class="modal-textarea" style="height: 48px; padding: 12px; font-weight: 600;" />
      </div>
      
      <div class="form-group" id="export-month-group" style="display: none;">
        <label>Select Month</label>
        <input type="month" id="export-month" class="modal-textarea" style="height: 48px; padding: 12px; font-weight: 600;" />
      </div>
      
      <button class="btn btn-primary" onclick="processExportExcel()" style="width: 100%; margin-top: 8px; background: #1d6f42;">Download Excel (.xlsx)</button>
    </div>
  </div>
</div>


<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar-nav">
  <div class="sidebar-header">
    <div class="restaurant-name">🍽️ Lokalin</div>
    <button class="close-btn" onclick="toggleSidebar()" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <a href="/dashboard" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </a>
  <a href="/order?table=5" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    Order (Customer)
  </a>
  <a href="/cashier" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Bar &amp; Cashier
  </a>
  <a href="/admin" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Admin Menu
  </a>
  <a href="/stock" class="sidebar-link" style="color:#fff;">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    Stock Management
  </a>
  <a href="/sales" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Sales Report
  </a>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="/stock.js?v=11"></script>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar-nav').classList.toggle('show');
    document.getElementById('sidebar-overlay').classList.toggle('show');
  }
</script>
</body>
</html>
