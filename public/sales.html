<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Penjualan — Lokalin</title>
  <meta name="description" content="Laporan penjualan harian makanan dan minuman Lokalin Café." />
  <link rel="stylesheet" href="/style.css?v=9" />
  <script src="/pin.js"></script>
  <style>
    .sales-table-wrapper {
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
    }
    .sales-table {
      width: 100%;
      min-width: 500px;
      border-collapse: collapse;
      text-align: left;
    }
    .sales-table th {
      padding: 10px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-strong);
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      background: var(--bg-card);
    }
    .sales-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
    }
    .sales-table tr:last-child td { border-bottom: none; }
    /* Sticky columns */
    .sales-table .s-no  { position: sticky; left: 0; background: var(--bg-card); z-index: 1; width: 44px; min-width: 44px; }
    .sales-table .s-name { position: sticky; left: 44px; background: var(--bg-card); z-index: 1; min-width: 180px; font-weight: 700; }
    /* Past date cells */
    .date-cell { min-width: 64px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
    .date-cell.zero { color: var(--text-muted); opacity: 0.45; }
    /* Today column */
    .sales-table th.th-today { color: var(--accent); background: rgba(99,179,237,0.08); }
    .sales-table td.td-today { background: rgba(99,179,237,0.04); text-align: center; }
    .qty-input {
      width: 58px; padding: 6px 8px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-family: inherit; font-size: 0.9rem; text-align: center;
      transition: var(--transition); display: block; margin: 0 auto;
    }
    .qty-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .qty-input[type=number] { -moz-appearance: textfield; }
    /* Delete btn */
    .icon-btn-del {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text-muted); width: 28px; height: 28px;
      border-radius: var(--radius-md); cursor: pointer; display: grid; place-items: center; transition: var(--transition);
    }
    .icon-btn-del:hover { background: rgba(229,62,62,0.2); color: #fc8181; border-color: rgba(229,62,62,0.4); }
    /* History */
    .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; }
    .history-date { font-weight: 700; font-size: 1rem; color: var(--accent); margin-bottom: 12px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .history-table th, .history-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-strong); text-align: left; }
    .history-table th { color: var(--text-muted); }
  </style>
</head>
<body>

<!-- Header -->
<div class="admin-header">
  <div class="admin-header-left">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-icon">📊</span>
    <div class="page-title">Laporan Penjualan Harian</div>
  </div>
</div>

<div class="admin-body">

  <!-- Tabs -->
  <div class="tabs-wrapper" style="margin-bottom:24px;max-width:none;padding:0;">
    <div class="tab-nav" style="margin:0;display:inline-flex;">
      <button class="tab-btn active" onclick="switchTab('makanan')">🍔 Makanan</button>
      <button class="tab-btn" onclick="switchTab('minuman')">🍹 Minuman</button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
    <button id="closeDayBtn" class="btn btn-primary">✅ Tutup Hari (Closing)</button>
    <button id="refreshBtn" class="btn btn-ghost" onclick="refreshSalesData()" title="Ambil data terbaru dari cloud">🔄 Refresh Data</button>
    <button id="viewHistoryBtn" class="btn btn-ghost">🗓️ Riwayat Rekap</button>
    <button onclick="openExportModal()" class="btn btn-ghost" style="background:#1d6f42;color:#fff;border:none;">📊 Export Excel</button>
  </div>

  <!-- Add Product Form -->
  <div class="add-form">
    <h3 id="add-title">+ Tambah Produk ke Laporan</h3>
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>Nama Produk</label>
        <input type="text" id="inp-name" placeholder="cth: ES JERUK" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addProduct()">+ Tambah</button>
      <button class="btn btn-ghost" onclick="document.getElementById('inp-name').value=''">Bersihkan</button>
    </div>
  </div>

  <!-- Sales Table -->
  <div class="sales-table-wrapper">
    <table class="sales-table">
      <thead id="salesHead"></thead>
      <tbody id="salesBody"></tbody>
    </table>
  </div>

</div>

<!-- History Modal -->
<div id="historyModal" class="modal-overlay">
  <div class="checkout-panel" style="max-height:85vh;overflow-y:auto;text-align:left;max-width:860px;opacity:1!important;transform:none!important;">
    <div class="checkout-header">
      <h2 class="checkout-title" id="historyTitle">🗓️ Riwayat Penjualan</h2>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost" onclick="clearSalesHistory()" style="padding:6px 12px;color:#fc8181;border-color:rgba(229,62,62,0.3);font-size:0.8rem;">🗑️ Bersihkan</button>
        <button class="modal-close" onclick="document.getElementById('historyModal').classList.remove('show')">✕</button>
      </div>
    </div>
    <div id="historyContainer" style="margin-top:16px;"></div>
  </div>
</div>

<!-- Export Modal -->
<div id="exportModal" class="modal-overlay">
  <div class="checkout-panel" style="text-align:left;opacity:1!important;transform:none!important;">
    <div class="checkout-header">
      <h2 class="checkout-title">📊 Export Data ke Excel</h2>
      <button class="modal-close" onclick="document.getElementById('exportModal').classList.remove('show')">✕</button>
    </div>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label>Format Laporan</label>
        <select id="export-type" class="modal-textarea" style="height:48px;padding:12px;font-weight:600;" onchange="toggleExportInputs()">
          <option value="hari_ini">Rekap Hari Ini (Belum Ditutup)</option>
          <option value="harian">Laporan Harian (Pilih Tanggal)</option>
          <option value="bulanan">Laporan Bulanan (Pilih Bulan)</option>
          <option value="semua">Semua Riwayat</option>
        </select>
      </div>
      <div class="form-group" id="export-date-group" style="display:none;">
        <label>Pilih Tanggal</label>
        <input type="date" id="export-date" class="modal-textarea" style="height:48px;padding:12px;font-weight:600;" />
      </div>
      <div class="form-group" id="export-month-group" style="display:none;">
        <label>Pilih Bulan</label>
        <input type="month" id="export-month" class="modal-textarea" style="height:48px;padding:12px;font-weight:600;" />
      </div>
      <button class="btn btn-primary" onclick="processExportExcel()" style="width:100%;margin-top:8px;background:#1d6f42;">Unduh Excel (.xlsx)</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal-overlay">
  <div class="checkout-panel" style="text-align:left;max-width:400px;opacity:1!important;transform:none!important;">
    <div class="checkout-header" style="border-bottom:none;padding-bottom:0;">
      <h2 class="checkout-title" id="confirmTitle" style="font-size:1.25rem;">Konfirmasi</h2>
      <button class="modal-close" onclick="closeConfirmModal()">✕</button>
    </div>
    <div style="padding:16px 20px 24px;">
      <p id="confirmMessage" style="color:var(--text-secondary);line-height:1.5;margin-bottom:24px;">Pesan konfirmasi...</p>
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <button class="btn btn-ghost" id="confirmCancelBtn" onclick="closeConfirmModal()">Batal</button>
        <button class="btn btn-primary" id="confirmOkBtn" style="background:var(--accent);">OK</button>
      </div>
    </div>
  </div>
</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar-nav">
  <div class="sidebar-header">
    <div class="restaurant-name">🍽️ Lokalin</div>
    <button class="close-btn" onclick="toggleSidebar()" aria-label="Tutup">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <a href="/dashboard" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </a>
  <a href="/order?table=5" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    Pesan (Customer)
  </a>
  <a href="/cashier" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Bar &amp; Kasir
  </a>
  <a href="/admin" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Admin Menu
  </a>
  <a href="/stock" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    Manajemen Stok
  </a>
  <a href="/sales" class="sidebar-link" style="color:#fff;">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Laporan Penjualan
  </a>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="/sales.js?v=1"></script>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar-nav').classList.toggle('show');
    document.getElementById('sidebar-overlay').classList.toggle('show');
  }
</script>
</body>
</html>
