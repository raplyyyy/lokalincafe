<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Menu — Lokalin</title>
  <meta name="description" content="Kelola menu makanan dan minuman." />
  <link rel="stylesheet" href="/style.css?v=9" />
  <script src="/pin.js"></script>
</head>
<body>

<!-- Header -->
<div class="admin-header">
  <div class="admin-header-left">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-icon">⚙️</span>
    <div class="page-title">Admin Menu</div>
  </div>
</div>

<div class="admin-body">

  <!-- Tabs -->
  <div class="tabs-wrapper">
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('food')">🍽️ Makanan</button>
      <button class="tab-btn" onclick="switchTab('drinks')">🍹 Minuman</button>
      <button class="tab-btn" onclick="switchTab('report')">📈 Laporan</button>
    </div>
  </div>

  <!-- Add Form -->
  <div class="add-form">
    <h3 id="add-title">+ Tambah Makanan</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Nama Item</label>
        <input type="text" id="inp-name" placeholder="cth: Nasi Goreng" />
      </div>
      <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" id="inp-price" placeholder="25000" min="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Deskripsi</label>
        <input type="text" id="inp-desc" placeholder="Deskripsi singkat…" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addItem()">+ Tambah</button>
      <button class="btn btn-ghost" onclick="clearForm()">Bersihkan</button>
    </div>
  </div>

  <!-- Menu List -->
  <div id="menu-list-container">
    <div class="empty-state"><div class="spinner"></div></div>
  </div>

  <!-- Report Dashboard -->
  <div id="report-container" style="display:none;">
    <!-- Filter Bar -->
    <div style="background:var(--bg-card); padding:16px 20px; border-radius:var(--radius-lg); border:1px solid var(--border); margin-bottom:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
      <div style="flex:1; min-width:140px;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Mode</label>
        <select id="report-mode" onchange="toggleReportMode()" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;">
          <option value="today">Hari Ini</option>
          <option value="date">Pilih Tanggal</option>
          <option value="month">Pilih Bulan</option>
        </select>
      </div>
      <div id="filter-date-group" style="flex:1; min-width:140px; display:none;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Tanggal</label>
        <input type="date" id="report-date-input" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;" />
      </div>
      <div id="filter-month-group" style="flex:1; min-width:140px; display:none;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Bulan</label>
        <input type="month" id="report-month-input" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;" />
      </div>
      <button onclick="loadReport()" style="padding:8px 20px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-md); font-weight:700; cursor:pointer; white-space:nowrap;">🔍 Tampilkan</button>
    </div>

    <!-- Summary Cards -->
    <div class="dashboard-summary" style="margin-bottom:24px; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
      <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
        <div style="color:var(--text-muted); font-size:0.85rem; font-weight:700; text-transform:uppercase; margin-bottom:8px;">Total Pendapatan</div>
        <div id="report-revenue" style="font-size:1.8rem; font-weight:900; color:var(--green);">Rp 0</div>
      </div>
      <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
        <div style="color:var(--text-muted); font-size:0.85rem; font-weight:700; text-transform:uppercase; margin-bottom:8px;">Total Pesanan Selesai</div>
        <div id="report-orders" style="font-size:1.8rem; font-weight:900; color:var(--text-primary);">0</div>
      </div>
    </div>
    
    <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
      <h4 id="report-popular-title" style="margin-bottom:16px; color:var(--accent);">🏆 Menu Paling Laris</h4>
      <div id="report-popular-items" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar-nav">
  <div class="sidebar-header">
    <div class="restaurant-name">🍽️ Lokalin</div>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <a href="/order?table=5" class="sidebar-link">📱 Pesan (Customer)</a>
  <a href="/cashier" class="sidebar-link">👩‍🍳 Bar & Kasir</a>
  <a href="/admin" class="sidebar-link">⚙️ Admin Menu</a>
</div>

<script>
let currentTab = "food";
let menu = { food: [], drinks: [] };

const ICONS = {
  food:   ["🍛","🍜","🍗","🌶️","🥘","🥗","🥡","🍚","🥩","🧆","🫕","🥚"],
  drinks: ["🧋","🍊","🥑","🥭","💧","☕","🥛","🍵","🧃","🫖","🍹","🥤"]
};

window.addEventListener("DOMContentLoaded", loadMenu);

async function loadMenu() {
  try {
    const res = await fetch("/api/menu");
    menu = await res.json();
    renderList();
  } catch {
    document.getElementById("menu-list-container").innerHTML = "<p style='color:var(--red)'>Gagal memuat menu</p>";
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach((btn, i) => {
    btn.classList.toggle("active", 
      (i === 0 && tab === "food") || 
      (i === 1 && tab === "drinks") || 
      (i === 2 && tab === "report")
    );
  });
  
  const addForm = document.querySelector(".add-form");
  const menuList = document.getElementById("menu-list-container");
  const reportContainer = document.getElementById("report-container");
  
  if (tab === "report") {
    addForm.style.display = "none";
    menuList.style.display = "none";
    reportContainer.style.display = "block";
    loadReport();
  } else {
    addForm.style.display = "block";
    menuList.style.display = "block";
    reportContainer.style.display = "none";
    document.getElementById("add-title").textContent = tab === "food" ? "+ Tambah Makanan" : "+ Tambah Minuman";
    renderList();
  }
}

function toggleReportMode() {
  const mode = document.getElementById('report-mode').value;
  document.getElementById('filter-date-group').style.display  = mode === 'date'  ? 'block' : 'none';
  document.getElementById('filter-month-group').style.display = mode === 'month' ? 'block' : 'none';
}

async function loadReport() {
  const container = document.getElementById("report-popular-items");
  container.innerHTML = `<div class="spinner"></div>`;
  
  const mode  = document.getElementById('report-mode').value;
  const dateV = document.getElementById('report-date-input').value;
  const monthV= document.getElementById('report-month-input').value;

  let url, label;
  if (mode === 'today') {
    url   = '/api/reports/today';
    label = 'Hari Ini';
  } else if (mode === 'date' && dateV) {
    url   = `/api/reports/date?date=${dateV}`;
    const d = new Date(dateV + 'T00:00:00');
    label = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  } else if (mode === 'month' && monthV) {
    url   = `/api/reports/date?month=${monthV}`;
    const [y, m] = monthV.split('-');
    label = new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  } else {
    container.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:20px;">Pilih tanggal/bulan lalu klik Tampilkan.</div>`;
    return;
  }

  document.getElementById('report-popular-title').innerHTML = `🏆 Menu Paling Laris &mdash; ${label}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.success) throw new Error();
    
    document.getElementById("report-revenue").textContent = "Rp " + data.totalRevenue.toLocaleString("id-ID");
    document.getElementById("report-orders").textContent = data.totalOrders;
    
    if (data.popularItems.length === 0) {
      container.innerHTML = `<div class="empty-state">Belum ada pesanan selesai pada periode ini</div>`;
    } else {
      container.innerHTML = data.popularItems.map((item, i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--bg-input); border-radius:var(--radius-md);">
          <span style="font-weight:600;"><span style="color:var(--text-muted); margin-right:8px; min-width:24px; display:inline-block;">#${i+1}</span> ${escHtml(item.name)}</span>
          <span style="font-weight:800; color:var(--accent); background:rgba(239,68,68,0.1); padding:4px 12px; border-radius:999px;">${item.qty}x</span>
        </div>
      `).join("");
    }
  } catch (err) {
    container.innerHTML = `<div style="color:var(--red);">Gagal memuat laporan</div>`;
  }
}

function renderList() {
  const items = menu[currentTab] || [];
  const icons = ICONS[currentTab];
  const container = document.getElementById("menu-list-container");
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>Belum ada item</h3></div>`;
    return;
  }
  container.innerHTML = items.map((item, i) => `
    <div class="menu-item-row">
      <div class="row-icon">${icons[i % icons.length]}</div>
      <div class="row-info">
        <div class="row-name">${escHtml(item.name)}</div>
        <div class="row-desc">${escHtml(item.description || "")}</div>
      </div>
      <div class="row-price">Rp ${Number(item.price).toLocaleString("id-ID")}</div>
      <button class="del-btn" onclick="deleteItem('${item.id}')">🗑 Hapus</button>
    </div>`).join("");
}

async function addItem() {
  const name  = document.getElementById("inp-name").value.trim();
  const price = parseInt(document.getElementById("inp-price").value);
  const desc  = document.getElementById("inp-desc").value.trim();

  if (!name || !price || price < 0) { alert("Nama dan harga wajib diisi!"); return; }

  try {
    const res = await fetch("/api/menu/item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: currentTab, item: { name, price, description: desc } }),
    });
    const data = await res.json();
    if (!data.success) throw new Error();
    clearForm();
    await loadMenu();
  } catch { alert("Gagal menambah item."); }
}

async function deleteItem(id) {
  if (!confirm("Hapus item ini?")) return;
  try {
    const res = await fetch(`/api/menu/item/${currentTab}/${id}`, { method: "DELETE" });
    const data = await res.json();
    if (!data.success) throw new Error();
    await loadMenu();
  } catch { alert("Gagal menghapus item."); }
}

function clearForm() {
  document.getElementById("inp-name").value = "";
  document.getElementById("inp-price").value = "";
  document.getElementById("inp-desc").value = "";
}
function toggleSidebar() {
  document.getElementById('sidebar-nav').classList.toggle('show');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
