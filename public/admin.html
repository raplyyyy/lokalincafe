<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Menu — Lokalin</title>
  <meta name="description" content="Manage food and drink menus." />
  <link rel="stylesheet" href="/style.css?v=13" />
  <script src="/pin.js"></script>
</head>
<body>

<!-- Header -->
<div class="admin-header">
  <div class="admin-header-left">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-icon">⚙️</span>
    <div class="page-title">Admin Menu</div>
  </div>
</div>

<div class="admin-body">

  <!-- Tabs -->
  <div class="tabs-wrapper">
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('food')">🍽️ Food</button>
      <button class="tab-btn" onclick="switchTab('drinks')">🍹 Drinks</button>
      <button class="tab-btn" onclick="switchTab('report')">📈 Report</button>
    </div>
  </div>

  <!-- Add Form -->
  <div class="add-form">
    <h3 id="add-title">+ Add Menu</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="inp-name" placeholder="e.g., Fried Rice" />
      </div>
      <div class="form-group">
        <label>Price (Rp)</label>
        <input type="number" id="inp-price" placeholder="25000" min="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category / Section</label>
        <select id="inp-category" style="width:100%;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-family:inherit;font-size:0.9rem;">
          <!-- Options are populated dynamically by updateCategoryDropdown() -->
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="inp-desc" placeholder="Short description…" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addItem()">+ Add</button>
      <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <!-- Menu List -->
  <div id="menu-list-container">
    <div class="empty-state"><div class="spinner"></div></div>
  </div>

  <!-- Report Dashboard -->
  <div id="report-container" style="display:none;">
    <!-- Filter Bar -->
    <div style="background:var(--bg-card); padding:16px 20px; border-radius:var(--radius-lg); border:1px solid var(--border); margin-bottom:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
      <div style="flex:1; min-width:140px;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Mode</label>
        <select id="report-mode" onchange="toggleReportMode()" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;">
          <option value="today">Today</option>
          <option value="date">Select Date</option>
          <option value="month">Select Month</option>
        </select>
      </div>
      <div id="filter-date-group" style="flex:1; min-width:140px; display:none;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Date</label>
        <input type="date" id="report-date-input" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;" />
      </div>
      <div id="filter-month-group" style="flex:1; min-width:140px; display:none;">
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase;">Month</label>
        <input type="month" id="report-month-input" style="width:100%; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary); font-size:0.9rem;" />
      </div>
      <button onclick="loadReport()" style="padding:8px 20px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-md); font-weight:700; cursor:pointer; white-space:nowrap;">🔍 Show</button>
    </div>

    <!-- Summary Cards -->
    <div class="dashboard-summary" style="margin-bottom:24px; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
      <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
        <div style="color:var(--text-muted); font-size:0.85rem; font-weight:700; text-transform:uppercase; margin-bottom:8px;">Total Revenue</div>
        <div id="report-revenue" style="font-size:1.8rem; font-weight:900; color:var(--green);">Rp 0</div>
      </div>
      <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
        <div style="color:var(--text-muted); font-size:0.85rem; font-weight:700; text-transform:uppercase; margin-bottom:8px;">Total Completed Orders</div>
        <div id="report-orders" style="font-size:1.8rem; font-weight:900; color:var(--text-primary);">0</div>
      </div>
    </div>
    
    <div style="background:var(--bg-card); padding:20px; border-radius:var(--radius-lg); border:1px solid var(--border);">
      <h4 id="report-popular-title" style="margin-bottom:16px; color:var(--accent);">🏆 Best Selling Menu</h4>
      <div id="report-popular-items" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

</div>

<!-- Move Category Modal -->
<div id="moveCatModal" class="modal-overlay" onclick="if(event.target===this)closeMoveModal()">
  <div class="checkout-panel" style="max-width:420px;text-align:left;opacity:1!important;transform:none!important;">
    <div class="checkout-header">
      <div>
        <h2 class="checkout-title" style="font-size:1.1rem;">📁 Move to Category</h2>
        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">
          Item: <strong id="moveCatItemName" style="color:var(--text-secondary);"></strong>
        </div>
        <div style="font-size:0.78rem;color:var(--text-muted);">
          Current: <span id="moveCatCurrent" style="color:var(--accent);font-weight:700;"></span>
        </div>
      </div>
      <button class="modal-close" onclick="closeMoveModal()">✕</button>
    </div>
    <div id="moveCatOptions" style="display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:0 4px 4px;"></div>
    <div style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeMoveModal()" style="width:100%;justify-content:center;">Cancel</button>
    </div>
  </div>
</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar-nav">
  <div class="sidebar-header">
    <div class="restaurant-name">🍽️ Lokalin</div>
    <button class="close-btn" onclick="toggleSidebar()" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <a href="/dashboard" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </a>
  <a href="/order?table=5" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    Order (Customer)
  </a>
  <a href="/cashier" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Bar &amp; Cashier
  </a>
  <a href="/admin" class="sidebar-link" style="color:#fff;">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Admin Menu
  </a>
  <a href="/stock" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    Stock Management
  </a>
  <a href="/sales" class="sidebar-link">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Sales Report
  </a>
</div>

<script>
let currentTab = "food";
let menu = { food: [], drinks: [] };

const ICONS = {
  food:   ["🍛","🍜","🍗","🌶️","🥘","🥗","🥡","🍚","🥩","🧆","🫕","🥚"],
  drinks: ["🧋","🍊","🥑","🥭","💧","☕","🥛","🍵","🧃","🫖","🍹","🥤"]
};

window.addEventListener("DOMContentLoaded", async () => {
  updateCategoryDropdown(); // Init dropdown for default 'food' tab
  await loadMenu();
});

async function loadMenu() {
  try {
    const res = await fetch("/api/menu");
    menu = await res.json();
    renderList();
  } catch {
    document.getElementById("menu-list-container").innerHTML = "<p style='color:var(--red)'>Failed to load menu</p>";
  }
}

// ── These category lists MUST stay in sync with DRINK_CATS in server.js ──────
const FOOD_CATEGORIES = [
  { value: 'Main Food', label: '🍛 Main Food' },
  { value: 'Snack',     label: '🍟 Snack' },
  { value: 'Pasta',     label: '🍝 Pasta' },
  { value: 'Dessert',   label: '🍮 Dessert' },
  { value: 'Paket',     label: '🎁 Paket' },
];
// NOTE: Values here MUST exactly match entries in server.js DRINK_CATS set (Title Case)
const DRINK_CATEGORIES = [
  { value: 'Coffee Series',      label: '☕ Coffee Series' },
  { value: 'Signature Coffee',   label: '✨ Signature Coffee' },
  { value: 'Non Coffee Series',  label: '🥛 Non Coffee Series' },
  { value: 'Tea Series',         label: '🍵 Tea Series' },
  { value: 'Juice',              label: '🍊 Juice' },
  { value: 'Squash',             label: '🥤 Squash' },
  { value: 'Blend',              label: '🧋 Blend' },
  { value: 'Other Drink',        label: '🍹 Other Drink' },
];

function updateCategoryDropdown() {
  const select = document.getElementById('inp-category');
  if (!select) return;
  const cats = currentTab === 'food' ? FOOD_CATEGORIES : DRINK_CATEGORIES;
  select.innerHTML = cats.map(c => `<option value="${c.value}">${c.label}</option>`).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach((btn, i) => {
    btn.classList.toggle("active", 
      (i === 0 && tab === "food") || 
      (i === 1 && tab === "drinks") || 
      (i === 2 && tab === "report")
    );
  });
  
  const addForm = document.querySelector(".add-form");
  const menuList = document.getElementById("menu-list-container");
  const reportContainer = document.getElementById("report-container");
  
  if (tab === "report") {
    addForm.style.display = "none";
    menuList.style.display = "none";
    reportContainer.style.display = "block";
    loadReport();
  } else {
    addForm.style.display = "block";
    menuList.style.display = "block";
    reportContainer.style.display = "none";
    document.getElementById("add-title").textContent = tab === "food" ? "+ Add Food" : "+ Add Drinks";
    updateCategoryDropdown();
    renderList();
  }
}

function toggleReportMode() {
  const mode = document.getElementById('report-mode').value;
  document.getElementById('filter-date-group').style.display  = mode === 'date'  ? 'block' : 'none';
  document.getElementById('filter-month-group').style.display = mode === 'month' ? 'block' : 'none';
}

async function loadReport() {
  const container = document.getElementById("report-popular-items");
  container.innerHTML = `<div class="spinner"></div>`;
  
  const mode  = document.getElementById('report-mode').value;
  const dateV = document.getElementById('report-date-input').value;
  const monthV= document.getElementById('report-month-input').value;

  let url, label;
  if (mode === 'today') {
    url   = '/api/reports/today';
    label = 'Today';
  } else if (mode === 'date' && dateV) {
    url   = `/api/reports/date?date=${dateV}`;
    const d = new Date(dateV + 'T00:00:00');
    label = d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  } else if (mode === 'month' && monthV) {
    url   = `/api/reports/date?month=${monthV}`;
    const [y, m] = monthV.split('-');
    label = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  } else {
    container.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:20px;">Select a date/month then click Show.</div>`;
    return;
  }

  document.getElementById('report-popular-title').innerHTML = `🏆 Most Popular Menu &mdash; ${label}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.success) throw new Error();
    
    document.getElementById("report-revenue").textContent = "Rp " + data.totalRevenue.toLocaleString("id-ID");
    document.getElementById("report-orders").textContent = data.totalOrders;
    
    if (data.popularItems.length === 0) {
      container.innerHTML = `<div class="empty-state">No completed orders in this period</div>`;
    } else {
      container.innerHTML = data.popularItems.map((item, i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--bg-input); border-radius:var(--radius-md);">
          <span style="font-weight:600;"><span style="color:var(--text-muted); margin-right:8px; min-width:24px; display:inline-block;">#${i+1}</span> ${escHtml(item.name)}</span>
          <span style="font-weight:800; color:var(--accent); background:rgba(239,68,68,0.1); padding:4px 12px; border-radius:999px;">${item.qty}x</span>
        </div>
      `).join("");
    }
  } catch (err) {
    container.innerHTML = `<div style="color:var(--red);">Failed to load report</div>`;
  }
}

function renderList() {
  const items = menu[currentTab] || [];
  const icons = ICONS[currentTab];
  const container = document.getElementById("menu-list-container");
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>No items yet</h3></div>`;
    return;
  }
  container.innerHTML = items.map((item, i) => `
    <div class="menu-item-row">
      <div class="row-icon">${icons[i % icons.length]}</div>
      <div class="row-info">
        <div class="row-name">${escHtml(item.name)}</div>
        <div class="row-desc">
          ${item.category ? `<span style="background:rgba(99,179,237,0.12);color:var(--accent);border:1px solid rgba(99,179,237,0.25);border-radius:4px;padding:1px 7px;font-size:0.72rem;font-weight:700;margin-right:6px;">${escHtml(item.category)}</span>` : ''}
          ${escHtml(item.description || "")}
        </div>
      </div>
      <div class="row-price">Rp ${Number(item.price).toLocaleString("id-ID")}</div>
      <button onclick="changeItemCategory('${item.id}', '${escHtml(item.name)}', '${escHtml(item.category || '')}')" title="Move to another category" style="background:rgba(99,179,237,0.1);border:1px solid rgba(99,179,237,0.25);color:var(--accent);padding:6px 10px;border-radius:var(--radius-md);cursor:pointer;font-size:0.78rem;font-weight:700;white-space:nowrap;transition:all 0.2s;margin-right:6px;" onmouseover="this.style.background='rgba(99,179,237,0.22)'" onmouseout="this.style.background='rgba(99,179,237,0.1)'">📁 Move</button>
      <button class="del-btn" onclick="deleteItem('${item.id}')">🗑 Delete</button>
    </div>`).join("");
}

async function addItem() {
  const name     = document.getElementById("inp-name").value.trim();
  const price    = parseInt(document.getElementById("inp-price").value);
  const desc     = document.getElementById("inp-desc").value.trim();
  const subcategory = document.getElementById("inp-category")?.value || '';

  if (!name || !price || price < 0) { alert("Name and price are required!"); return; }

  try {
    const res = await fetch("/api/menu/item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: currentTab, subcategory, item: { name, price, description: desc } }),
    });
    const data = await res.json();
    if (!data.success) throw new Error();
    clearForm();
    await loadMenu();
  } catch { alert("Failed to add item."); }
}

async function deleteItem(id) {
  if (!confirm("Delete this item?")) return;
  try {
    const res = await fetch(`/api/menu/item/${currentTab}/${id}`, { method: "DELETE" });
    const data = await res.json();
    if (!data.success) throw new Error();
    await loadMenu();
  } catch { alert("Failed to delete item."); }
}


function clearForm() {
  document.getElementById("inp-name").value = "";
  document.getElementById("inp-price").value = "";
  document.getElementById("inp-desc").value = "";
}

let _moveCatItemId = null;

// itemName is now passed explicitly so the modal shows the real name, not the ID
function changeItemCategory(itemId, itemName, currentCat) {
  _moveCatItemId = itemId;
  const cats = currentTab === 'food' ? FOOD_CATEGORIES : DRINK_CATEGORIES;

  // Populate modal info — show real item name, not raw ID
  document.getElementById('moveCatItemName').textContent = itemName || itemId;
  document.getElementById('moveCatCurrent').textContent = currentCat || '(none)';

  // Build clickable option cards
  const container = document.getElementById('moveCatOptions');
  container.innerHTML = cats.map(c => {
    const isActive = c.value === currentCat;
    return `
      <button onclick="applyMoveCategory('${c.value}')" style="
        display:flex;align-items:center;gap:10px;
        padding:12px 14px;
        background:${isActive ? 'rgba(99,179,237,0.15)' : 'var(--bg-input)'};
        border:1px solid ${isActive ? 'rgba(99,179,237,0.5)' : 'var(--border)'};
        border-radius:var(--radius-md);
        color:${isActive ? 'var(--accent)' : 'var(--text-primary)'};
        font-family:inherit;font-size:0.88rem;font-weight:${isActive ? '800' : '600'};
        cursor:pointer;width:100%;text-align:left;
        transition:all 0.15s;
      " onmouseover="if('${c.value}'!=='${currentCat}'){this.style.background='rgba(99,179,237,0.1)';this.style.borderColor='rgba(99,179,237,0.3)';}" onmouseout="if('${c.value}'!=='${currentCat}'){this.style.background='var(--bg-input)';this.style.borderColor='var(--border)';}">
        <span style="font-size:1.2rem;">${c.label.split(' ')[0]}</span>
        <span>${c.label.split(' ').slice(1).join(' ')}${isActive ? ' ✓' : ''}</span>
      </button>`;
  }).join('');

  document.getElementById('moveCatModal').classList.add('show');
}

function closeMoveModal() {
  document.getElementById('moveCatModal').classList.remove('show');
  _moveCatItemId = null;
}

async function applyMoveCategory(newCat) {
  if (!_moveCatItemId) return;
  closeMoveModal();
  try {
    const res = await fetch(`/api/menu/item/${_moveCatItemId}/category`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category: newCat })
    });
    const data = await res.json();
    if (!data.success) throw new Error();
    await loadMenu();
  } catch { alert('Failed to update category.'); }
}

function toggleSidebar() {
  document.getElementById('sidebar-nav').classList.toggle('show');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
